
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Select | Neha & Rahul</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <p class="eyebrow">WELCOME TO OUR CREATIVE UNIVERSE</p>

    <h1>PLAYER SELECT</h1>

    <p class="subtitle">
      Two artists. Two worlds. One creative universe.
    </p>

    <h2 class="section-title">CHOOSE YOUR PLAYER</h2>

    <section class="players">

      <article class="player-card">
        <p class="player-number">PLAYER 01</p>

        <div class="character-placeholder">🎀</div>

        <h3>NEHA</h3>
        <p>Animation, imagination & a little magic.</p>

        <button class="select-button">
          ENTER NEHA'S WORLD
        </button>
      </article>

      <article class="player-card">
        <p class="player-number">PLAYER 02</p>

        <div class="character-placeholder">🎮</div>

        <h3>RAHUL</h3>
        <p>Characters, creativity & beyond reality.</p>

        <button class="select-button">
          ENTER RAHUL'S WORLD
        </button>
      </article>

    </section>

    <footer>
      TWO PLAYERS · INFINITE POSSIBILITIES
    </footer>
  </main>
</body>
</html>
